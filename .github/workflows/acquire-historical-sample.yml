name: Acquire historical sample

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire frozen EURUSD M1 BID sample
        run: >-
          uv run python -m mr_lab.providers.dukascopy
          --date 2024-01-02
          --output-dir data/raw/stage-1a-r
      - name: Parse, validate, resample, and audit frozen sample
        run: >-
          uv run python -m mr_lab.providers.dukascopy_bi5
          --input data/raw/stage-1a-r/EURUSD-2024-01-02-M1-BID.bi5
          --date 2024-01-02
          --expected-sha256
          9b2d2b718f9ca123b58dce4b4512d4e1bd35c692e23e1beafebdd700072cf546
          --audit-output data/raw/stage-1a-r/EURUSD-2024-01-02-canonicalization-audit.json
      - name: Upload immutable raw snapshot, provenance, and canonicalization audit
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-eurusd-m1-bid-2024-01-02
          path: data/raw/stage-1a-r/
          if-no-files-found: error
          retention-days: 14

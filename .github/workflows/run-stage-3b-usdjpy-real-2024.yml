name: Run Stage 3B USDJPY real 2024 replication

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  replicate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.number == 20 &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked development environment
        run: uv sync --locked --dev

      - name: Download and verify the immutable USDJPY full-year corpus
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: "9326494647"
          SOURCE_WORKFLOW_RUN_ID: "32122032975"
          SOURCE_ARTIFACT_NAME: dukascopy-USDJPY-m1-bid-2024-full-year
        run: |
          set -euo pipefail
          mkdir -p artifact-download corpus-extracted

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}" \
            > artifact-download/metadata.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(
              Path("artifact-download/metadata.json").read_text(encoding="utf-8")
          )
          if metadata.get("id") != int(os.environ["SOURCE_ARTIFACT_ID"]):
              raise SystemExit("downloaded artifact metadata has an unexpected ID")
          if metadata.get("name") != os.environ["SOURCE_ARTIFACT_NAME"]:
              raise SystemExit("downloaded artifact metadata has an unexpected name")
          if metadata.get("expired") is not False:
              raise SystemExit("the pinned source artifact is expired")
          workflow_run = metadata.get("workflow_run") or {}
          if workflow_run.get("id") != int(os.environ["SOURCE_WORKFLOW_RUN_ID"]):
              raise SystemExit("artifact originates from an unexpected workflow run")
          PY

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            > artifact-download/usdjpy-2024.zip
          unzip -q artifact-download/usdjpy-2024.zip -d corpus-extracted

          mapfile -d '' manifests < <(
            find corpus-extracted -type f -name corpus-manifest.json -print0
          )
          if [[ ${#manifests[@]} -ne 1 ]]; then
            echo "Expected exactly one corpus-manifest.json; found ${#manifests[@]}." >&2
            exit 1
          fi
          corpus_dir="$(dirname "${manifests[0]}")"
          printf 'CORPUS_DIR=%s\n' "$corpus_dir" >> "$GITHUB_ENV"

      - name: Run the complete frozen Stage 3B USDJPY grid
        run: |
          set -euo pipefail
          uv run mr-lab-replicate \
            --instrument USDJPY \
            --corpus-dir "$CORPUS_DIR" \
            --output-dir results/stage-3b-usdjpy \
            --canonical-m1-vwap

      - name: Verify outputs and write deterministic execution audit
        env:
          SOURCE_ARTIFACT_ID: "9326494647"
          SOURCE_WORKFLOW_RUN_ID: "32122032975"
          SOURCE_ARTIFACT_NAME: dukascopy-USDJPY-m1-bid-2024-full-year
        run: |
          set -euo pipefail
          export SOURCE_COMMIT_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          corpus_dir = Path(os.environ["CORPUS_DIR"])
          output_dir = Path("results/stage-3b-usdjpy")
          manifest = json.loads(
              (corpus_dir / "corpus-manifest.json").read_text(encoding="utf-8")
          )
          if manifest.get("instrument") != "USDJPY":
              raise SystemExit("source corpus is not USDJPY")
          if (
              manifest.get("requested_start_date") != "2024-01-01"
              or manifest.get("requested_end_date") != "2024-12-31"
          ):
              raise SystemExit("source corpus is not the complete frozen 2024 range")

          families = ("vwap", "vwap-canonical-m1", "bollinger")
          timeframes = ("m5", "m15", "h1")
          result_names = tuple(
              f"stage-3b-usdjpy-{family}-{timeframe}.json"
              for family in families
              for timeframe in timeframes
          )
          expected = {
              *result_names,
              "stage-3b-usdjpy-comparison.md",
          }
          actual = {path.name for path in output_dir.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(
                  f"unexpected Stage 3B outputs: expected={sorted(expected)!r} "
                  f"actual={sorted(actual)!r}"
              )
          for name in result_names:
              document = json.loads((output_dir / name).read_text(encoding="utf-8"))
              if (
                  document.get("instrument") != "USDJPY"
                  or document.get("assembled_dataset_id")
                  != manifest["assembled_dataset_id"]
              ):
                  raise SystemExit(f"result identity mismatch: {name}")

          result_hashes = {
              name: hashlib.sha256((output_dir / name).read_bytes()).hexdigest()
              for name in sorted(expected)
          }
          audit = {
              "assembled_dataset_id": manifest["assembled_dataset_id"],
              "corpus_id": manifest["corpus_id"],
              "instrument": "USDJPY",
              "requested_end_date": manifest["requested_end_date"],
              "requested_start_date": manifest["requested_start_date"],
              "result_files": list(result_names),
              "result_sha256": result_hashes,
              "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
              "source_artifact_name": os.environ["SOURCE_ARTIFACT_NAME"],
              "source_commit_sha": os.environ["SOURCE_COMMIT_SHA"],
              "source_workflow_run_id": int(os.environ["SOURCE_WORKFLOW_RUN_ID"]),
          }
          (output_dir / "execution-audit.json").write_text(
              json.dumps(audit, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"corpus_id={audit['corpus_id']}")
          print(f"assembled_dataset_id={audit['assembled_dataset_id']}")
          for name in result_names:
              print(f"result={name}")
          PY

      - name: Upload immutable Stage 3B USDJPY research artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-3b-usdjpy-2024-results-source-9326494647
          path: results/stage-3b-usdjpy/
          if-no-files-found: error
          retention-days: 90

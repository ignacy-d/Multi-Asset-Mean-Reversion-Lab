name: Run Stage 4B real 2024 trade construction

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: Frozen instrument or the complete universe
        required: true
        type: choice
        default: EURUSD
        options: [EURUSD, GBPUSD, USDJPY, AUDUSD, AUDJPY]
      upload_raw:
        description: Upload large raw Stage4B JSONL artifacts
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  STAGE4B_SHARD_COUNT: "4"

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - id: selection
        env: {SELECTED: "${{ inputs.instrument }}"}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Stage 4B real runs require main'; exit 1; }
          echo "selection=$SELECTED" >> "$GITHUB_OUTPUT"

  registry-preflight:
    needs: select
    runs-on: ubuntu-latest
    outputs:
      instruments: ${{ steps.preflight.outputs.instruments }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: preflight
        env: {SELECTED: "${{ needs.select.outputs.selection }}"}
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from mr_lab.stage4a_runner import load_corpus_registry, select_verified_registry_entries
          registry = load_corpus_registry(Path('configs/stage4a-2024-corpus-registry.json'))
          entries = select_verified_registry_entries(registry, os.environ['SELECTED'])
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('instruments=' + json.dumps([e['instrument'] for e in entries], separators=(',', ':')) + '\n')
          PY

  shard:
    needs: registry-preflight
    strategy:
      fail-fast: false
      matrix:
        instrument: ${{ fromJSON(needs.registry-preflight.outputs.instruments) }}
        shard_index: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --locked
      - name: Resolve immutable corpus provenance
        env: {INSTRUMENT: "${{ matrix.instrument }}"}
        run: |
          set -euo pipefail
          mkdir -p source corpus result
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from mr_lab.stage4a_runner import load_corpus_registry, validate_registry_entry
          registry = load_corpus_registry(Path('configs/stage4a-2024-corpus-registry.json'))
          entry = validate_registry_entry(os.environ['INSTRUMENT'], registry['instruments'][os.environ['INSTRUMENT']], require_verified=True)
          Path('source/entry.json').write_text(json.dumps(entry, sort_keys=True, separators=(',', ':')) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write(f"RUN_ID={entry['source_workflow_run_id']}\nARTIFACT_ID={entry['source_artifact_id']}\nARTIFACT_NAME={entry['source_artifact_name']}\n")
          PY
          echo "INSTRUMENT_LOWER=${INSTRUMENT,,}" >> "$GITHUB_ENV"
      - name: Reverify and download pinned immutable corpus
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > source/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > source/artifact.json
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('source/entry.json').read_text()); r=json.loads(Path('source/run.json').read_text()); a=json.loads(Path('source/artifact.json').read_text())
          if r.get('id') != e['source_workflow_run_id'] or r.get('conclusion') != 'success': raise SystemExit('pinned workflow run identity/status mismatch')
          if a.get('id') != e['source_artifact_id'] or a.get('name') != e['source_artifact_name'] or a.get('expired') is not False: raise SystemExit('pinned artifact identity/expiry mismatch')
          if (a.get('workflow_run') or {}).get('id') != e['source_workflow_run_id']: raise SystemExit('artifact workflow provenance mismatch')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > source/corpus.zip
          unzip -q source/corpus.zip -d corpus
          mapfile -d '' manifests < <(find corpus -type f -name corpus-manifest.json -print0)
          test ${#manifests[@]} -eq 1
          echo "CORPUS_DIR=$(dirname "${manifests[0]}")" >> "$GITHUB_ENV"
      - name: Run deterministic runtime shard
        env:
          INSTRUMENT: "${{ matrix.instrument }}"
          SHARD_INDEX: "${{ matrix.shard_index }}"
        run: |
          set -euo pipefail
          echo '=== resources before shard ==='; free -h; df -h
          export STAGE4B_RAW_ARTIFACT_NAME="stage-4b-${INSTRUMENT_LOWER}-2024-raw-shard-${SHARD_INDEX}-attempt-${GITHUB_RUN_ATTEMPT}-${ARTIFACT_ID}"
          export STAGE4B_COMPACT_ARTIFACT_NAME="stage-4b-${INSTRUMENT_LOWER}-2024-compact-shard-${SHARD_INDEX}-attempt-${GITHUB_RUN_ATTEMPT}-${ARTIFACT_ID}"
          /usr/bin/time -v uv run mr-lab-stage4b --instrument "$INSTRUMENT" --corpus-dir "$CORPUS_DIR" --output-dir result --registry configs/stage4a-2024-corpus-registry.json --shard-index "$SHARD_INDEX" --shard-count "$STAGE4B_SHARD_COUNT"
          test -f result/shard-manifest.json
          echo '=== resources after shard ==='; free -h; df -h
      - name: Safe failure diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          free -h || true; df -h || true
          find result -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4b-${{ env.INSTRUMENT_LOWER }}-2024-compact-shard-${{ matrix.shard_index }}-attempt-${{ github.run_attempt }}-${{ env.ARTIFACT_ID }}
          path: |
            result/shard-manifest.json
            result/entry-diagnostics.csv
            result/trade-matrix.csv
            result/first-passage-distributions.csv
            result/conditional-hit.csv
            result/entry-wait-distributions.csv
            result/stage4b-distributions.csv
            result/summary.json
            result/report.md
            result/execution-audit.json
          if-no-files-found: error
          retention-days: 30
      - if: ${{ inputs.upload_raw == true }}
        uses: actions/upload-artifact@v4
        with:
          name: stage-4b-${{ env.INSTRUMENT_LOWER }}-2024-raw-shard-${{ matrix.shard_index }}-attempt-${{ github.run_attempt }}-${{ env.ARTIFACT_ID }}
          path: |
            result/candidate-events.jsonl
            result/trades.jsonl
          if-no-files-found: error
          retention-days: 7

  reducer:
    needs: [registry-preflight, shard]
    strategy:
      fail-fast: false
      matrix:
        instrument: ${{ fromJSON(needs.registry-preflight.outputs.instruments) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - env: {INSTRUMENT: "${{ matrix.instrument }}"}
        run: echo "INSTRUMENT_LOWER=${INSTRUMENT,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: stage-4b-${{ env.INSTRUMENT_LOWER }}-2024-compact-shard-*
          path: shards
      - run: uv run mr-lab-stage4b-reduce --shard-root shards --output-dir review --shard-count "$STAGE4B_SHARD_COUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4b-${{ env.INSTRUMENT_LOWER }}-2024-combined-review-${{ github.run_id }}
          path: review/
          if-no-files-found: error
          retention-days: 90

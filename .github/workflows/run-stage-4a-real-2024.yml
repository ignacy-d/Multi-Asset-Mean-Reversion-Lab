name: Run Stage 4A real 2024 path diagnostics

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: Frozen instrument or the complete universe
        required: true
        type: choice
        default: ALL
        options: [ALL, EURUSD, GBPUSD, USDJPY, AUDUSD, AUDJPY]

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      instruments: ${{ steps.matrix.outputs.instruments }}
    steps:
      - name: Require main and construct the fixed matrix
        id: matrix
        env:
          SELECTED: ${{ inputs.instrument }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Stage 4A real runs require refs/heads/main'; exit 1; }
          if [[ "$SELECTED" == ALL ]]; then
            echo 'instruments=["EURUSD","GBPUSD","USDJPY","AUDUSD","AUDJPY"]' >> "$GITHUB_OUTPUT"
          else
            echo "instruments=[\"$SELECTED\"]" >> "$GITHUB_OUTPUT"
          fi

  diagnose:
    needs: select
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        instrument: ${{ fromJSON(needs.select.outputs.instruments) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --locked
      - name: Derive immutable result artifact name
        env: {INSTRUMENT: "${{ matrix.instrument }}"}
        run: echo "INSTRUMENT_LOWER=${INSTRUMENT,,}" >> "$GITHUB_ENV"
      - name: Resolve and verify the pinned immutable corpus
        env:
          GH_TOKEN: ${{ github.token }}
          INSTRUMENT: ${{ matrix.instrument }}
        run: |
          set -euo pipefail
          mkdir -p source corpus result
          python - <<'PY'
          import json, os
          from pathlib import Path
          registry=json.loads(Path('configs/stage4a-2024-corpus-registry.json').read_text())
          entry=registry['instruments'][os.environ['INSTRUMENT']]
          required=('source_workflow_run_id','source_artifact_id','corpus_id','assembled_dataset_id')
          if entry.get('verification_status') != 'verified' or any(not entry.get(k) for k in required):
              raise SystemExit('registry entry is not independently verified; refusing real run')
          Path('source/entry.json').write_text(json.dumps(entry,sort_keys=True,separators=(',',':'))+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write(f"RUN_ID={entry['source_workflow_run_id']}\nARTIFACT_ID={entry['source_artifact_id']}\nARTIFACT_NAME={entry['source_artifact_name']}\n")
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > source/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > source/artifact.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('source/entry.json').read_text()); r=json.loads(Path('source/run.json').read_text()); a=json.loads(Path('source/artifact.json').read_text())
          if r.get('id') != e['source_workflow_run_id'] or r.get('conclusion') != 'success': raise SystemExit('pinned workflow run identity/status mismatch')
          if a.get('id') != e['source_artifact_id'] or a.get('name') != e['source_artifact_name'] or a.get('expired') is not False: raise SystemExit('pinned artifact identity/expiry mismatch')
          if (a.get('workflow_run') or {}).get('id') != e['source_workflow_run_id']: raise SystemExit('artifact workflow provenance mismatch')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > source/corpus.zip
          unzip -q source/corpus.zip -d corpus
          mapfile -d '' manifests < <(find corpus -type f -name corpus-manifest.json -print0)
          test ${#manifests[@]} -eq 1 || { echo 'expected exactly one corpus manifest'; exit 1; }
          echo "CORPUS_DIR=$(dirname "${manifests[0]}")" >> "$GITHUB_ENV"
      - name: Verify manifest pin and run Stage 4A CLI
        env: {INSTRUMENT: "${{ matrix.instrument }}"}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('source/entry.json').read_text()); m=json.loads((Path(os.environ['CORPUS_DIR'])/'corpus-manifest.json').read_text())
          for k in ('instrument','corpus_id','assembled_dataset_id','requested_start_date','requested_end_date'):
              if m.get(k) != e[k]: raise SystemExit(f'manifest registry mismatch: {k}')
          PY
          uv run mr-lab-stage4a --instrument "$INSTRUMENT" --corpus-dir "$CORPUS_DIR" --output-dir result --registry-entry source/entry.json
          test "$(find result -maxdepth 1 -type f | wc -l)" -eq 5
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4a-${{ env.INSTRUMENT_LOWER }}-2024-path-diagnostics-source-${{ env.ARTIFACT_ID }}
          path: |
            result/events.jsonl
            result/matrix.csv
            result/summary.json
            result/report.md
            result/execution-audit.json
          if-no-files-found: error
          retention-days: 90

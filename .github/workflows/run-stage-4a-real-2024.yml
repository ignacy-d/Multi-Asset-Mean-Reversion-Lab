name: Run Stage 4A real 2024 path diagnostics

on:
  workflow_dispatch:
    inputs:
      instrument:
        description: Frozen instrument or the complete universe
        required: true
        type: choice
        default: ALL
        options: [ALL, EURUSD, GBPUSD, USDJPY, AUDUSD, AUDJPY]

permissions:
  contents: read
  actions: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - name: Require main and construct the fixed matrix
        id: selection
        env:
          SELECTED: ${{ inputs.instrument }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Stage 4A real runs require refs/heads/main'; exit 1; }
          echo "selection=$SELECTED" >> "$GITHUB_OUTPUT"

  registry-preflight:
    needs: select
    runs-on: ubuntu-latest
    outputs:
      instruments: ${{ steps.preflight.outputs.instruments }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Require every selected immutable source to be verified
        id: preflight
        env:
          SELECTED: ${{ needs.select.outputs.selection }}
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from mr_lab.stage4a_runner import load_corpus_registry, select_verified_registry_entries
          registry = load_corpus_registry(Path('configs/stage4a-2024-corpus-registry.json'))
          entries = select_verified_registry_entries(registry, os.environ['SELECTED'])
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('instruments=' + json.dumps([entry['instrument'] for entry in entries], separators=(',', ':')) + '\n')
          PY

  diagnose:
    needs: registry-preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        instrument: ${{ fromJSON(needs.registry-preflight.outputs.instruments) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --locked
      - name: Derive immutable result artifact name
        env: {INSTRUMENT: "${{ matrix.instrument }}"}
        run: echo "INSTRUMENT_LOWER=${INSTRUMENT,,}" >> "$GITHUB_ENV"
      - name: Resolve the selected validated registry entry
        env:
          INSTRUMENT: ${{ matrix.instrument }}
        run: |
          set -euo pipefail
          mkdir -p source corpus result
          uv run python - <<'PY'
          import json, os
          from pathlib import Path
          from mr_lab.stage4a_runner import load_corpus_registry, validate_registry_entry
          registry=load_corpus_registry(Path('configs/stage4a-2024-corpus-registry.json'))
          entry=validate_registry_entry(os.environ['INSTRUMENT'], registry['instruments'][os.environ['INSTRUMENT']], require_verified=True)
          Path('source/entry.json').write_text(json.dumps(entry,sort_keys=True,separators=(',',':'))+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
              f.write(f"RUN_ID={entry['source_workflow_run_id']}\nARTIFACT_ID={entry['source_artifact_id']}\nARTIFACT_NAME={entry['source_artifact_name']}\n")
          PY

      - name: Reverify and download the pinned immutable corpus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > source/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > source/artifact.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('source/entry.json').read_text()); r=json.loads(Path('source/run.json').read_text()); a=json.loads(Path('source/artifact.json').read_text())
          if r.get('id') != e['source_workflow_run_id'] or r.get('conclusion') != 'success': raise SystemExit('pinned workflow run identity/status mismatch')
          if a.get('id') != e['source_artifact_id'] or a.get('name') != e['source_artifact_name'] or a.get('expired') is not False: raise SystemExit('pinned artifact identity/expiry mismatch')
          if (a.get('workflow_run') or {}).get('id') != e['source_workflow_run_id']: raise SystemExit('artifact workflow provenance mismatch')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > source/corpus.zip
          unzip -q source/corpus.zip -d corpus
          mapfile -d '' manifests < <(find corpus -type f -name corpus-manifest.json -print0)
          test ${#manifests[@]} -eq 1 || { echo 'expected exactly one corpus manifest'; exit 1; }
          echo "CORPUS_DIR=$(dirname "${manifests[0]}")" >> "$GITHUB_ENV"
      - name: Verify manifest pin and run Stage 4A CLI
        env: {INSTRUMENT: "${{ matrix.instrument }}"}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          e=json.loads(Path('source/entry.json').read_text()); m=json.loads((Path(os.environ['CORPUS_DIR'])/'corpus-manifest.json').read_text())
          for k in ('instrument','corpus_id','assembled_dataset_id','requested_start_date','requested_end_date'):
              if m.get(k) != e[k]: raise SystemExit(f'manifest registry mismatch: {k}')
          PY
          echo '=== Stage 4A runner resources before CLI ==='
          nproc || true
          free -h || true
          df -h || true
          ulimit -a || true
          /usr/bin/time -v uv run mr-lab-stage4a --instrument "$INSTRUMENT" --corpus-dir "$CORPUS_DIR" --output-dir result --registry configs/stage4a-2024-corpus-registry.json
          test "$(find result -maxdepth 1 -type f | wc -l)" -eq 5
          echo '=== Stage 4A runner resources after successful CLI ==='
          free -h || true
          df -h || true
      - name: Print safe failure or cancellation diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          echo '=== Stage 4A failure diagnostics (no market-data contents) ==='
          free -h || true
          df -h || true
          ps -eo pid,ppid,%cpu,%mem,rss,vsz,stat,comm --sort=-rss | head -40 || true
          if [[ -d result ]]; then
            find result -maxdepth 1 -type f -printf '%f %s bytes\n' | sort || true
          else
            echo 'result directory is absent'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4a-${{ env.INSTRUMENT_LOWER }}-2024-path-diagnostics-source-${{ env.ARTIFACT_ID }}
          path: |
            result/events.jsonl
            result/matrix.csv
            result/summary.json
            result/report.md
            result/execution-audit.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: stage-4a-${{ env.INSTRUMENT_LOWER }}-2024-review-source-${{ env.ARTIFACT_ID }}
          path: |
            result/matrix.csv
            result/summary.json
            result/report.md
            result/execution-audit.json
          if-no-files-found: error
          retention-days: 90

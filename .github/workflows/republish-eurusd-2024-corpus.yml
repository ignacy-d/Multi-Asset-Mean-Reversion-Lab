name: Republish EURUSD 2024 corpus

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEGACY_RUN_ID: "31746932310"
      LEGACY_ARTIFACT_ID: "9202006993"
      LEGACY_ARTIFACT_NAME: dukascopy-eurusd-m1-bid-2024-01-01-2024-12-31
      CANONICAL_ARTIFACT_NAME: dukascopy-EURUSD-m1-bid-2024-full-year
      EXPECTED_CORPUS_ID: sha256:ce14fc8557b11afd11f81c928370452eca4f023b1d9d72c296ff69d7cb073009
      EXPECTED_ASSEMBLED_DATASET_ID: sha256:af4c1e166e94c4a10e40586ef33319aa134531d93f84c59922b746aca559c916
    steps:
      - name: Require main
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::EURUSD corpus republication requires refs/heads/main'; exit 1; }

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: uv sync --locked

      - name: Verify pinned legacy GitHub metadata and download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p source corpus republish audit
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LEGACY_RUN_ID" > source/run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$LEGACY_ARTIFACT_ID" > source/artifact.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          run = json.loads(Path('source/run.json').read_text())
          artifact = json.loads(Path('source/artifact.json').read_text())
          if run.get('id') != int(os.environ['LEGACY_RUN_ID']):
              raise SystemExit('legacy workflow run identity mismatch')
          if run.get('conclusion') != 'success':
              raise SystemExit('legacy workflow run was not successful')
          if artifact.get('id') != int(os.environ['LEGACY_ARTIFACT_ID']):
              raise SystemExit('legacy artifact identity mismatch')
          if artifact.get('name') != os.environ['LEGACY_ARTIFACT_NAME']:
              raise SystemExit('legacy artifact name mismatch')
          if artifact.get('expired') is not False:
              raise SystemExit('legacy artifact is expired')
          if (artifact.get('workflow_run') or {}).get('id') != int(os.environ['LEGACY_RUN_ID']):
              raise SystemExit('legacy artifact workflow provenance mismatch')
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$LEGACY_ARTIFACT_ID/zip" > source/legacy.zip
          unzip -q source/legacy.zip -d corpus
          mapfile -d '' manifests < <(find corpus -type f -name corpus-manifest.json -print0)
          test ${#manifests[@]} -eq 1 || { echo 'expected exactly one corpus manifest'; exit 1; }
          echo "CORPUS_DIR=$(dirname "${manifests[0]}")" >> "$GITHUB_ENV"

      - name: Verify immutable EURUSD corpus and current offline reconstruction
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json, os, shutil
          from datetime import date
          from pathlib import Path

          from mr_lab.providers.dukascopy_range import build_corpus_manifest, load_offline_corpus
          from mr_lab.providers.dukascopy_multiday import DailyPayload

          corpus_dir = Path(os.environ['CORPUS_DIR'])
          manifest_path = corpus_dir / 'corpus-manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          expected = {
              'instrument': 'EURUSD',
              'requested_start_date': '2024-01-01',
              'requested_end_date': '2024-12-31',
              'corpus_id': os.environ['EXPECTED_CORPUS_ID'],
              'assembled_dataset_id': os.environ['EXPECTED_ASSEMBLED_DATASET_ID'],
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f'legacy manifest mismatch: {key}')

          dataset = load_offline_corpus(corpus_dir)
          if dataset.metadata.dataset_id != os.environ['EXPECTED_ASSEMBLED_DATASET_ID']:
              raise SystemExit('offline reconstructed dataset identity mismatch')

          payloads = []
          for day_text in manifest['successful_component_dates']:
              day = date.fromisoformat(day_text)
              raw = (corpus_dir / f'EURUSD-{day_text}-M1-BID.bi5').read_bytes()
              payloads.append(DailyPayload(day, raw, 'EURUSD'))
          rebuilt = build_corpus_manifest(
              date(2024, 1, 1),
              date(2024, 12, 31),
              payloads,
              [date.fromisoformat(x) for x in manifest['confirmed_absent_dates']],
              'EURUSD',
          )
          if rebuilt.corpus_id != os.environ['EXPECTED_CORPUS_ID']:
              raise SystemExit('rebuilt corpus identity mismatch')

          target = Path('republish')
          for item in corpus_dir.iterdir():
              if item.is_file():
                  shutil.copy2(item, target / item.name)
          PY

      - name: Write deterministic migration audit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          audit = {
              'legacy_source_workflow_run_id': int(os.environ['LEGACY_RUN_ID']),
              'legacy_source_artifact_id': int(os.environ['LEGACY_ARTIFACT_ID']),
              'legacy_source_artifact_name': os.environ['LEGACY_ARTIFACT_NAME'],
              'republished_artifact_name': os.environ['CANONICAL_ARTIFACT_NAME'],
              'instrument': 'EURUSD',
              'requested_start_date': '2024-01-01',
              'requested_end_date': '2024-12-31',
              'corpus_id': os.environ['EXPECTED_CORPUS_ID'],
              'assembled_dataset_id': os.environ['EXPECTED_ASSEMBLED_DATASET_ID'],
              'legacy_artifact_metadata_verification': 'passed',
              'manifest_verification': 'passed',
              'component_sha_provenance_verification': 'passed',
              'offline_reconstruction_identity_verification': 'passed',
              'verification_repository_commit_sha': os.environ['GITHUB_SHA'],
          }
          Path('audit/eurusd-2024-corpus-republication-audit.json').write_text(
              json.dumps(audit, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload deterministic migration audit
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-2024-corpus-republication-audit
          path: audit/eurusd-2024-corpus-republication-audit.json
          if-no-files-found: error
          retention-days: 90

      - name: Republish unchanged EURUSD corpus under current canonical name
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-EURUSD-m1-bid-2024-full-year
          path: republish/
          if-no-files-found: error
          retention-days: 90

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-asset-mean-reversion-lab"
version = "0.1.0"
description = "A configuration-first foundation for multi-asset mean-reversion research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
]

[project.scripts]
mr-lab-bollinger-benchmark = "mr_lab.bollinger_benchmark:main"
mr-lab-vwap-benchmark = "mr_lab.vwap_benchmark:main"
mr-lab-vwap-m1-robustness = "mr_lab.vwap_m1_robustness:main"
mr-lab-replicate = "mr_lab.replication:main"
mr-lab-stage4a = "mr_lab.stage4a_runner:main"
mr-lab-stage4b = "mr_lab.stage4b_runner:main"
mr-lab-stage4b-reduce = "mr_lab.stage4b_reducer:main"
mr-lab-stage4c = "mr_lab.stage4c_runner:main"
mr-lab-stage4c-reduce = "mr_lab.stage4c_reducer:main"
mr-lab-replay-mr-ou-costs = "mr_lab.fx_replay:main"
mr-lab-stage4-discovery-atlas = "mr_lab.stage4_discovery_atlas:main"
mr-lab-failed-breakout-stage0 = "mr_lab.failed_breakout_stage0_runner:main"
mr-lab-trend-exhaustion-stage0 = "mr_lab.trend_exhaustion_stage0_runner:main"
mr-lab-trend-exhaustion-quality = "mr_lab.trend_exhaustion_quality:main"
mr-lab-bollinger-incremental = "mr_lab.bollinger_incremental:main"
mr-lab-ou-diagnostics = "mr_lab.ornstein_uhlenbeck_runner:main"
mr-lab-ou-monte-carlo = "mr_lab.ou_monte_carlo_runner:main"
mr-lab-freeze-study = "mr_lab.spec_lock:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mr_lab"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-asset-mean-reversion-lab"
version = "0.1.0"
description = "A configuration-first foundation for multi-asset mean-reversion research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mr-lab-bollinger-benchmark = "mr_lab.bollinger_benchmark:main"
mr-lab-vwap-benchmark = "mr_lab.vwap_benchmark:main"
mr-lab-vwap-m1-robustness = "mr_lab.vwap_m1_robustness:main"
mr-lab-replicate = "mr_lab.replication:main"
mr-lab-stage4a = "mr_lab.stage4a_runner:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mr_lab"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
